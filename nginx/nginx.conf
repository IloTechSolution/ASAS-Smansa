# Konfigurasi nginx untuk container `web` CBT SMAN 1 Gorontalo.
# Sajikan SPA React dan proxy /api + /uploads + /socket.io ke service `api`.
# Pakai resolver Docker (127.0.0.11) + variable proxy_pass agar nama service
# di-resolve per-request (bukan saat nginx boot), sehingga tahan urutan start.
# Bila ada reverse proxy TLS di depan (Caddy/Nginx host), pakai proto dari
# proxy agar URL yang direkonstruksi API tetap https (penting untuk hash SEB).
# Tanpa proxy, header kosong -> fallback ke $scheme.
map $http_x_forwarded_proto $cbt_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Rate limit endpoint yang sensitif brute-force (login + verifikasi PIN SEB).
# Perlindungan brute-force utama tetap di aplikasi (lockout per-akun & per-IP+username,
# LOGIN_MAX_FAILURES per 5 menit). Batas nginx disesuaikan untuk ujian serentak:
# satu lab/RPT bisa berisi 400+ siswa di balik satu IP NAT, semua login dalam
# hitungan detik. burst=400 menampung rombongan itu; 600r/m (10/detik) tetap
# membatasi tebakan_password melintas dari satu IP setelah antrean habis.
limit_req_zone $binary_remote_addr zone=cbt_auth:10m rate=600r/m;
# Ganti status default 503 agar klien menerima 429 yang informatif.
limit_req_status 429;

# Kompresi respons teks (HTML/JS/CSS/JSON/SVG).
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Batas ukuran unggahan — samakan dengan UPLOAD_MAX_MB API (5 MB).
    client_max_body_size 5m;

    # Header keamanan untuk semua respons (lihat nginx/security-headers.conf).
    include /etc/nginx/snippets/security-headers.conf;

    set $api_upstream http://api:3000;

    # Healthcheck ringan langsung di nginx (tanpa menyentuh API).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Login — rate limited (selain throttle per-akun di aplikasi).
    location = /api/auth/login {
        limit_req zone=cbt_auth burst=400 nodelay;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $cbt_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Verifikasi PIN keluar SEB — endpoint publik sensitif brute-force.
    location = /api/seb/exit-verify {
        limit_req zone=cbt_auth burst=20 nodelay;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $cbt_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # API NestJS — URI diteruskan apa adanya (termasuk prefix /api).
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        # $http_host mempertahankan port (mis. localhost:8080). Diperlukan agar
        # URL yang direkonstruksi API sama persis dengan URL yang di-hash SEB.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $cbt_forwarded_proto;
        proxy_read_timeout 300s;
    }

    # File statis unggahan dari API.
    location /uploads/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $cbt_forwarded_proto;
    }

    # WebSocket Socket.IO (monitoring proktor).
    location /socket.io/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $cbt_forwarded_proto;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html SELALU divalidasi ulang. Tanpa ini browser memakai HTML lama
    # (cache heuristik) sehingga setelah deploy klien masih menunjuk bundle
    # ber-hash yang sudah tidak ada — halaman jadi kosong sampai hard refresh.
    # Location dengan add_header sendiri harus me-re-include security-headers
    # (turunan server tidak diwariskan bila ada add_header di location).
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Cache aset ber-hash dari Vite (aman lama: nama file berubah tiap build).
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
