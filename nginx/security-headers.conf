# Header keamanan untuk semua respons (SPA + API proxy + berkas statis).
# Di-include oleh nginx.conf di level server dan di location yang punya
# add_header sendiri (di nginx, add_header di location MEMBATALKAN turunan
# dari server — jadi berkas ini harus di-include eksplisit di sana).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
